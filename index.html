<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Cérebro da Marca: a IA revisa o vídeo do influenciador antes da marca, para ele chegar certo de primeira. Protótipo navegável.">
<title>Cérebro da Marca</title>
<style>
[hidden]{display:none!important}
/* ============ Tokens (base: Apple Human Interface Guidelines) ============ */
:root{
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --font-d:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --bg:#F2F2F7;--surface:#FFFFFF;--surface-2:#F9F9FB;--fill:rgba(118,118,128,.12);--fill-2:rgba(118,118,128,.07);
  --label:#1D1D1F;--label-2:#6E6E73;--label-3:#8E8E93;--sep:#D2D2D7;--sep-2:#E5E5EA;
  --accent:#0071E3;--accent-h:#0077ED;--accent-soft:#E8F1FD;--accent-text:#0066CC;
  --green:#248A3D;--green-fill:#34C759;--green-soft:#E4F6E9;
  --orange:#B45309;--orange-fill:#FF9500;--orange-soft:#FFF2DF;
  --red:#D70015;--red-fill:#FF3B30;--red-soft:#FFE7E5;
  --indigo:#3634A3;--indigo-fill:#5856D6;--indigo-soft:#EDECFC;
  --glass:rgba(255,255,255,.76);--glass-dark:rgba(29,29,31,.86);
  --shadow:0 1px 2px rgba(0,0,0,.04),0 4px 18px rgba(0,0,0,.05);
  --shadow-lg:0 24px 70px rgba(0,0,0,.18);
  --r:14px;--r-sm:10px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#000000;--surface:#1C1C1E;--surface-2:#2C2C2E;--fill:rgba(118,118,128,.24);--fill-2:rgba(118,118,128,.16);
    --label:#F5F5F7;--label-2:#AEAEB2;--label-3:#8E8E93;--sep:#38383A;--sep-2:#2C2C2E;
    --accent:#0A84FF;--accent-h:#409CFF;--accent-soft:#0A2A4D;--accent-text:#4DA3FF;
    --green:#30D158;--green-fill:#30D158;--green-soft:#0F2E18;
    --orange:#FF9F0A;--orange-fill:#FF9F0A;--orange-soft:#33230A;
    --red:#FF453A;--red-fill:#FF453A;--red-soft:#3A1412;
    --indigo:#9A99FF;--indigo-fill:#5E5CE6;--indigo-soft:#1E1D40;
    --glass:rgba(28,28,30,.78);--shadow:0 1px 2px rgba(0,0,0,.4),0 4px 18px rgba(0,0,0,.35);
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
html,body{margin:0;background:var(--bg);color:var(--label);font-family:var(--font);font-size:15px;line-height:1.47;letter-spacing:-.005em;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--font-d);margin:0;line-height:1.15;letter-spacing:-.02em;text-wrap:balance}
h1{font-size:2.1rem;font-weight:700}
h2{font-size:1.45rem;font-weight:700}
h3{font-size:1.07rem;font-weight:600;letter-spacing:-.01em}
p{margin:0}
ul,ol{margin:0;padding-left:1.15em}
a{color:var(--accent-text)}
button{font:inherit;color:inherit;cursor:pointer}
input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid color-mix(in srgb,var(--accent) 55%,transparent);outline-offset:2px;border-radius:8px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.muted{color:var(--label-2)}
.faint{color:var(--label-3)}
.small{font-size:.86rem}
.xs{font-size:.78rem}
.mono{font-family:var(--mono)}
.num{font-variant-numeric:tabular-nums}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:12px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px}
.grid4{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px}
.ic{width:20px;height:20px;flex-shrink:0;display:inline-block;vertical-align:middle}
.ic.sm{width:16px;height:16px}.ic.lg{width:28px;height:28px}.ic.xl{width:40px;height:40px}

/* ============ Botões ============ */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:36px;padding:7px 16px;border-radius:999px;border:0;font-weight:600;font-size:.94rem;background:var(--fill);color:var(--label);transition:background .15s,transform .05s;text-decoration:none;white-space:nowrap}
.btn:active{transform:scale(.98)}
.btn:hover{background:color-mix(in srgb,var(--fill) 70%,var(--label) 8%)}
.btn.primary{background:var(--accent);color:#fff}
.btn.primary:hover{background:var(--accent-h)}
.btn.tinted{background:var(--accent-soft);color:var(--accent-text)}
.btn.good{background:var(--green-fill);color:#fff}
.btn.good:hover{background:color-mix(in srgb,var(--green-fill) 88%,#000)}
.btn.warn{background:var(--orange-soft);color:var(--orange)}
.btn.danger{background:var(--red-soft);color:var(--red)}
.btn.plain{background:transparent;color:var(--accent-text);padding-inline:8px}
.btn.plain:hover{background:var(--accent-soft)}
.btn.lg{min-height:48px;padding:12px 24px;font-size:1.02rem}
.btn.sm{min-height:30px;padding:5px 12px;font-size:.84rem}
.btn.block{width:100%}
.btn[disabled]{opacity:.42;cursor:not-allowed;transform:none}
.iconbtn{width:36px;height:36px;border-radius:50%;border:0;background:var(--fill);display:inline-grid;place-items:center;color:var(--label-2)}
.iconbtn:hover{color:var(--label)}
.link{border:0;background:none;padding:0;color:var(--accent-text);font-weight:600;cursor:pointer}
.link:hover{text-decoration:underline}

/* ============ Superfícies ============ */
.card{background:var(--surface);border-radius:var(--r);padding:20px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px}
.card.flat{box-shadow:none;background:var(--surface-2);border:1px solid var(--sep-2)}
.card.tint{background:var(--accent-soft);box-shadow:none}
.card.hl{outline:2px solid var(--accent);outline-offset:-2px}
.card h3 .ic{color:var(--accent)}
.sechead{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.eyebrow{font-size:.78rem;font-weight:600;letter-spacing:.02em;color:var(--label-2);text-transform:none}
.kicker{font-size:.8rem;font-weight:600;color:var(--accent-text)}

/* grouped list (iOS) */
.group{background:var(--surface);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow)}
.group .gi{display:flex;align-items:center;gap:12px;padding:12px 16px;position:relative;min-height:48px}
.group .gi + .gi::before{content:"";position:absolute;top:0;left:52px;right:0;border-top:1px solid var(--sep-2)}
.group .gi.noicon + .gi::before,.group .gi.noicon::before{left:16px}
.group .gi .gic{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;color:#fff;flex-shrink:0}
.group .gi .gt{flex:1;min-width:0}
.group .gi .gt b{display:block;font-weight:600}
.group button.gi{width:100%;border:0;background:none;text-align:left}
.group button.gi:hover{background:var(--fill-2)}
.gh{font-size:.8rem;font-weight:600;color:var(--label-2);margin:18px 16px 6px;text-transform:uppercase;letter-spacing:.03em}

/* chips / status */
.chip{display:inline-flex;align-items:center;gap:5px;font-size:.78rem;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--fill);color:var(--label-2);white-space:nowrap}
.chip .ic{width:13px;height:13px}
.chip.good{background:var(--green-soft);color:var(--green)}
.chip.warn{background:var(--orange-soft);color:var(--orange)}
.chip.bad{background:var(--red-soft);color:var(--red)}
.chip.acc{background:var(--accent-soft);color:var(--accent-text)}
.chip.ind{background:var(--indigo-soft);color:var(--indigo)}
.badge{background:var(--red-fill);color:#fff;border-radius:999px;font-size:.72rem;font-weight:700;min-width:20px;height:20px;padding:0 6px;display:inline-grid;place-items:center}

/* forms */
.field{display:flex;flex-direction:column;gap:6px}
.field > span{font-size:.86rem;font-weight:600}
.field .hint{font-size:.8rem;color:var(--label-2);font-weight:400}
.inp{width:100%;border:1px solid transparent;background:var(--fill);border-radius:10px;padding:10px 12px;min-height:42px;outline:none}
.inp:focus{border-color:var(--accent);background:var(--surface);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 18%,transparent)}
textarea.inp{min-height:84px;resize:vertical}
.err{color:var(--red);font-size:.84rem;display:flex;gap:6px;align-items:center}
.seg{display:inline-flex;background:var(--fill);border-radius:10px;padding:2px;gap:2px}
.seg button{border:0;background:none;border-radius:8px;padding:6px 14px;font-weight:600;font-size:.88rem;color:var(--label);min-height:32px}
.seg button.on{background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.12),0 0 0 .5px rgba(0,0,0,.04)}
.seg.full{display:flex}.seg.full button{flex:1}
.switch{position:relative;width:51px;height:31px;display:inline-block;flex-shrink:0}
.switch input{opacity:0;width:100%;height:100%;margin:0;position:absolute;inset:0;cursor:pointer;z-index:1}
.switch span{position:absolute;inset:0;background:var(--fill);border-radius:999px;transition:background .2s}
.switch span::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 3px 8px rgba(0,0,0,.15),0 1px 1px rgba(0,0,0,.16);transition:transform .2s}
.switch input:checked + span{background:var(--green-fill)}
.switch input:checked + span::after{transform:translateX(20px)}
.switch input:focus-visible + span{outline:3px solid color-mix(in srgb,var(--accent) 55%,transparent);outline-offset:2px}
input[type=range]{accent-color:var(--accent);width:100%}

/* list chips (guia) */
.items{display:flex;flex-wrap:wrap;gap:8px}
.item{display:inline-flex;align-items:center;gap:6px;border-radius:9px;padding:6px 6px 6px 10px;font-size:.88rem;background:var(--fill-2)}
.item .ic{width:15px;height:15px}
.item button{border:0;background:none;color:var(--label-3);width:24px;height:24px;border-radius:6px;display:grid;place-items:center}
.item button:hover{background:var(--fill);color:var(--label)}
.item.yes .ic{color:var(--green)}.item.no .ic{color:var(--red)}.item.vis .ic{color:var(--accent-text)}.item.req .ic{color:var(--orange)}

/* tip (TipKit) */
.tip{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:start;background:var(--surface);border-radius:var(--r);padding:14px 14px 14px 16px;box-shadow:var(--shadow);border-left:4px solid var(--indigo-fill)}
.tip .ic{color:var(--indigo-fill);width:24px;height:24px}
.tip b{display:block;margin-bottom:2px}
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:40px 20px}
.empty .ic{width:44px;height:44px;color:var(--label-3)}

/* KPIs */
.kpi{background:var(--surface);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:4px}
.kpi .top{display:flex;justify-content:space-between;align-items:center;gap:8px;color:var(--label-2);font-size:.84rem;font-weight:600}
.kpi .v{font-family:var(--font-d);font-size:2rem;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.kpi .cmp{font-size:.8rem;color:var(--label-2);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.info{border:0;background:none;color:var(--label-3);width:26px;height:26px;border-radius:50%;display:inline-grid;place-items:center;padding:0}
.info:hover{color:var(--accent-text);background:var(--accent-soft)}
.info .ic{width:17px;height:17px}

/* barras */
.hb{display:grid;grid-template-columns:minmax(140px,1.2fr) 1fr 34px;gap:10px;align-items:center;font-size:.88rem}
.track{height:8px;background:var(--fill);border-radius:99px;position:relative;overflow:hidden}
.track i{position:absolute;left:0;top:0;bottom:0;border-radius:99px;background:var(--accent)}
.track i.good{background:var(--green-fill)}.track i.warn{background:var(--orange-fill)}.track i.bad{background:var(--red-fill)}.track i.ind{background:var(--indigo-fill)}
.hb .v{text-align:right;font-variant-numeric:tabular-nums;color:var(--label-2)}
.progress{height:6px;background:var(--fill);border-radius:99px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .35s ease}

/* tabela */
.tw{overflow-x:auto;background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow)}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{padding:11px 14px;text-align:left;vertical-align:middle;border-bottom:1px solid var(--sep-2)}
th{font-size:.78rem;font-weight:600;color:var(--label-2);background:var(--surface-2)}
tr:last-child td{border-bottom:0}
tr.click{cursor:pointer}tr.click:hover td{background:var(--fill-2)}
td.d.up{color:var(--green);font-weight:600}td.d.dn{color:var(--red);font-weight:600}

/* sheets / toast */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.36);display:grid;place-items:center;z-index:80;padding:20px;animation:fade .18s ease}
.sheet{background:var(--surface);border-radius:18px;max-width:560px;width:100%;max-height:88vh;overflow:auto;box-shadow:var(--shadow-lg);display:flex;flex-direction:column;animation:rise .22s ease}
.sheet.wide{max-width:720px}
.sheet .sh{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:16px 18px 10px;position:sticky;top:0;background:var(--surface);z-index:1}
.sheet .sb{padding:4px 20px 20px;display:flex;flex-direction:column;gap:14px}
.sheet .sf{display:flex;gap:10px;justify-content:flex-end;padding:12px 20px 18px;border-top:1px solid var(--sep-2);position:sticky;bottom:0;background:var(--surface)}
@keyframes fade{from{opacity:0}}
@keyframes rise{from{transform:translateY(14px);opacity:0}}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:90;background:var(--glass-dark);color:#fff;border-radius:14px;padding:10px 10px 10px 16px;display:flex;gap:14px;align-items:center;box-shadow:var(--shadow-lg);backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);max-width:calc(100vw - 32px);font-size:.92rem}
#toast .ic{color:var(--green-fill)}
#toast button{border:0;background:rgba(255,255,255,.16);color:#fff;border-radius:999px;padding:6px 12px;font-weight:600}
#toast button:hover{background:rgba(255,255,255,.28)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ============ Site (landing) ============ */
.site{background:var(--surface);min-height:100vh}
.snav{position:sticky;top:0;z-index:50;background:var(--glass);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid var(--sep-2)}
.snav .in{max-width:1120px;margin:0 auto;padding:10px 22px;display:flex;align-items:center;gap:22px}
.logo{display:flex;align-items:center;gap:9px;font-family:var(--font-d);font-weight:700;font-size:1.02rem;letter-spacing:-.01em;border:0;background:none;padding:0;color:var(--label)}
.logo .mk{width:28px;height:28px;border-radius:8px;background:linear-gradient(135deg,#0071E3,#5856D6);display:grid;place-items:center;color:#fff}
.logo .mk .ic{width:17px;height:17px}
.snav nav{display:flex;gap:18px;flex:1}
.snav nav button{border:0;background:none;color:var(--label-2);font-size:.88rem;padding:4px 0}
.snav nav button:hover{color:var(--label)}
.wrap{max-width:1120px;margin:0 auto;padding-inline:22px}
.hero{padding-block:72px 56px;display:grid;grid-template-columns:1.08fr .92fr;gap:40px;align-items:center}
.hero h1{font-size:clamp(2.4rem,5.2vw,3.7rem);font-weight:700;letter-spacing:-.035em;line-height:1.04}
.hero .sub{font-size:1.22rem;color:var(--label-2);max-width:34ch;margin-top:18px;line-height:1.45}
.hero .ctas{display:flex;gap:12px;margin-top:28px;flex-wrap:wrap}
.hero .micro{margin-top:14px;font-size:.86rem;color:var(--label-2);display:flex;gap:14px;flex-wrap:wrap}
.hero .micro span{display:inline-flex;gap:5px;align-items:center}
.hero .micro .ic{color:var(--green);width:16px;height:16px}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--indigo-soft);color:var(--indigo);border-radius:999px;padding:5px 12px;font-size:.84rem;font-weight:600;margin-bottom:16px}
.pill .ic{width:15px;height:15px}
.mock{position:relative;justify-self:center;width:340px;max-width:100%;padding-bottom:34px}
.mock .dev{background:var(--surface);border-radius:36px;padding:16px;box-shadow:var(--shadow-lg),0 0 0 10px #1D1D1F,0 0 0 11px #3A3A3C;display:flex;flex-direction:column;gap:12px}
.mock .float{position:absolute;right:-30px;bottom:0;background:var(--surface);border-radius:14px;box-shadow:var(--shadow-lg);padding:10px 14px;display:flex;gap:10px;align-items:center;font-weight:600;font-size:.9rem}
.mock .float .ic{color:var(--green-fill);width:26px;height:26px}
.band{background:var(--bg);padding-block:64px}
.band.alt{background:var(--surface)}
.sect-h{text-align:center;max-width:720px;margin:0 auto 36px}
.sect-h h2{font-size:clamp(1.8rem,3.4vw,2.6rem);letter-spacing:-.03em}
.sect-h p{color:var(--label-2);font-size:1.1rem;margin-top:10px}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.stat{background:var(--surface);border-radius:18px;padding:22px;display:flex;flex-direction:column;gap:6px;box-shadow:var(--shadow)}
.stat b{font-family:var(--font-d);font-size:2.6rem;letter-spacing:-.03em;line-height:1}
.feat{background:var(--surface);border-radius:18px;padding:24px;display:flex;flex-direction:column;gap:10px;box-shadow:var(--shadow)}
.feat .fi{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;color:#fff}
.steps4{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;counter-reset:s}
.st4{background:var(--surface);border-radius:18px;padding:22px;display:flex;flex-direction:column;gap:8px;box-shadow:var(--shadow);position:relative}
.st4 .n{width:30px;height:30px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:700;font-size:.9rem}
.st4.core{outline:2px solid var(--green-fill)}
.st4 .who{font-size:.78rem;font-weight:600;color:var(--label-2)}
.loopline{margin-top:16px;text-align:center;color:var(--label-2);display:flex;gap:8px;justify-content:center;align-items:center}
.loopline .ic{color:var(--indigo-fill)}
.two-aud{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.aud{border-radius:22px;padding:28px;display:flex;flex-direction:column;gap:14px}
.aud.b{background:linear-gradient(160deg,var(--accent-soft),var(--surface))}
.aud.c{background:linear-gradient(160deg,var(--green-soft),var(--surface))}
.aud ul{list-style:none;padding:0;display:flex;flex-direction:column;gap:10px}
.aud li{display:grid;grid-template-columns:22px 1fr;gap:10px}
.aud li .ic{color:var(--green);width:20px;height:20px;margin-top:1px}
.core-sec{display:grid;grid-template-columns:.9fr 1.1fr;gap:40px;align-items:center}
.core-sec ul{list-style:none;padding:0;display:flex;flex-direction:column;gap:16px}
.core-sec li{display:grid;grid-template-columns:40px 1fr;gap:12px}
.core-sec li .bx{width:40px;height:40px;border-radius:11px;display:grid;place-items:center}
.prices{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.price{background:var(--surface);border-radius:20px;padding:22px;display:flex;flex-direction:column;gap:10px;box-shadow:var(--shadow);position:relative}
.price.pop{outline:2px solid var(--accent)}
.price .tag{position:absolute;top:-11px;left:22px;background:var(--accent);color:#fff;font-size:.74rem;font-weight:700;padding:3px 10px;border-radius:999px}
.price .amt{font-family:var(--font-d);font-size:2rem;font-weight:700;letter-spacing:-.02em}
.price .amt small{font-size:.9rem;color:var(--label-2);font-weight:500}
.price ul{list-style:none;padding:0;display:flex;flex-direction:column;gap:7px;font-size:.9rem;flex:1}
.price li{display:grid;grid-template-columns:18px 1fr;gap:8px}
.price li .ic{color:var(--green);width:17px;height:17px;margin-top:2px}
.faq{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
.faq details{background:var(--surface);border-radius:14px;padding:4px 18px;box-shadow:var(--shadow)}
.faq summary{cursor:pointer;font-weight:600;padding:14px 0;list-style:none;display:flex;justify-content:space-between;gap:12px}
.faq summary::-webkit-details-marker{display:none}
.faq summary .ic{transition:transform .2s;color:var(--label-3)}

function wavg(items){const w=items.reduce((a,i)=>a+Number(i.weight||0),0);return w?Math.round(items.reduce((a,i)=>a+i.score*Number(i.weight||0),0)/w):0}
function findingText(id,label,b,c,dur){
  const T={gancho:0,obrigatorios:4,legenda:9,mensagem:15,ritmo:20,visual:24,tom:33,proibidos:41,publico:48,camp_msg:56,cta:dur-14,camp_cta:dur-9,duracao:dur-1};
  const t=T[id]??Math.round(dur*.6);
  const cup=c.cupom&&c.cupom!=='—'?` · ${c.cupom}`:'';
  const X={
    mensagem:[`O diferencial da marca não aparece: "${b.podeFalar[0]||'mensagem principal'}".`,`Diga isso em uma frase, do seu jeito, perto de ${mmss(15)}.`],
    tom:[`Trecho com tom diferente do da marca (${(b.tom||'').toLowerCase()}).`,`Fale como falaria com uma amiga, sem exagero.`],
    visual:[`Regra visual não atendida: ${b.visual[0]||'regra visual da marca'}.`,`Regrave só esta cena.`],
    proibidos:[`Frase que a marca não permite (${(b.naoPode[0]||'item proibido').toLowerCase()}).`,`Troque por algo que a marca permite: "${b.podeFalar[0]||'benefício permitido'}".`],
    obrigatorios:[`Falta um item obrigatório: ${b.obrigatorios[0]||'#publi'}.`,`Coloque na tela nos primeiros segundos ou na legenda.`],
    publico:[`As referências não falam com o público da marca (${b.publico}).`,`Traga um exemplo da rotina desse público.`],
    camp_msg:[`A mensagem da campanha ("${c.mensagem||'—'}") aparece tarde ou não aparece.`,`Traga essa ideia para a primeira metade do vídeo.`],
    camp_cta:[`Chamada da campanha incompleta: falta "${c.cta||'chamada'}${cup}".`,`Feche o vídeo com a chamada completa, falada e escrita.`],
    gancho:[`Os 3 primeiros segundos não mostram o produto nem fazem uma pergunta.`,`Comece com o produto na mão ou com uma pergunta direta.`],
    ritmo:[`Trecho longo sem corte (${mmss(20)} a ${mmss(32)}).`,`Corte ou acelere esse trecho.`],
    duracao:[`O vídeo tem ${mmss(dur)}; o ideal nesta campanha é ${c.duracao||'60 a 90 s'}.`,`Tire as partes que repetem a mesma ideia.`],
    cta:[`A chamada final passa rápido demais.`,`Segure a chamada por pelo menos 3 segundos, com texto na tela.`],
    legenda:[`Trechos falados sem legenda.`,`Ative a legenda automática e revise os erros.`],
  }[id]||[`O critério "${label}" não foi totalmente atendido.`,`Revise este ponto com base no guia da marca.`];
  return {t:clamp(t,0,dur),text:X[0],fix:X[1]};
}
function analyze(camp,b,quality,seed){
  const r=rng(seed||1), j=()=>Math.round((r()-.5)*8), dur=DUR[quality];
  const items=camp.criteria.map(c=>({id:c.id,label:c.label,weight:c.weight,elim:!!c.elim,score:clamp((Q[quality][c.id]??Q[quality]._)+j(),0,100)}));
  const pitems=camp.perf.map(c=>({id:c.id,label:c.label,weight:c.weight,score:clamp((Q[quality][c.id]??Q[quality]._)+j(),0,100)}));
  const ader=wavg(items), perf=wavg(pitems);
  const all=[];
  items.filter(i=>i.score<80&&Number(i.weight)>0).forEach(i=>all.push({crit:i.id,label:i.label,kind:'aderencia',score:i.score,w:Number(i.weight),sev:(i.elim&&i.score<60)?'block':i.score<60?'alta':'media',...findingText(i.id,i.label,b,camp,dur)}));
  pitems.filter(i=>i.score<75&&Number(i.weight)>0).forEach(i=>all.push({crit:i.id,label:i.label,kind:'performance',score:i.score,w:Number(i.weight),sev:'media',...findingText(i.id,i.label,b,camp,dur)}));
  const rank=f=>(f.sev==='block'?0:f.kind==='aderencia'?1:2)*1000-(100-f.score)*f.w/10;
  all.sort((a,b)=>rank(a)-rank(b));
  const findings=all.slice(0,5).sort((a,b)=>a.t-b.t);
  const blockedBy=items.filter(i=>i.elim&&Number(i.weight)>0&&i.score<60).map(i=>i.label);
  const blocked=blockedBy.length>0, pass=!blocked&&ader>=camp.minScore;
  return {quality,ader,perf,items,pitems,findings,minor:all.length-findings.length,blocked,blockedBy,pass,dur,min:camp.minScore};
}

function genPastVideos(n,seed,before){
  const r=rng(seed), out=[];
  for(let i=0;i<n;i++){
    const perf=Math.round(40+r()*55), ader=Math.round(58+r()*38);
    const ctr=+(clamp(.45+perf/100*1.9+(r()-.5)*.55,.2,4)).toFixed(2);
    const views=Math.round(20000+r()*25000);
    const vendas=Math.max(0,Math.round(views*ctr/100*(.04+perf/100*.04+(r()-.5)*.02)));
    out.push({creator:PAST_NAMES[(i+seed)%PAST_NAMES.length],ader,perf,views,ctr,vendas,rounds:0,days:0});
  }
  const nBack=Math.round(n*(before?.3:.1));
  const back=new Set(out.map((v,i)=>i).sort((a,b)=>out[a].ader-out[b].ader).slice(0,nBack));
  out.forEach((v,i)=>{ if(back.has(i)){ v.rounds=before?(r()<.7?2:3):1; v.days=before?7+Math.round(r()*2):+(2.5+r()).toFixed(1);} else { v.days=before?3+Math.round(r()*2):+(1+r()*.8).toFixed(1);} });
  return out;
}

function metrics(bid){
  const camps=S.campaigns.filter(c=>bid==='all'||c.brandId===bid), ids=new Set(camps.map(c=>c.id));
  const vids=S.videos.filter(v=>ids.has(v.campaignId));
  const sent=vids.filter(v=>SENT.includes(v.status)), appr=vids.filter(v=>v.status==='aprovado'), returned=vids.filter(v=>v.roundsBrand>0);
  const byCrit={}; vids.forEach(v=>v.versions.forEach(x=>x.findings.forEach(f=>{byCrit[f.label]=(byCrit[f.label]||0)+1})));
  return {camps,vids,sent,appr,
    first:appr.length?appr.filter(v=>v.roundsBrand===0).length/appr.length:null,
    rounds:returned.length?avg(returned.map(v=>v.roundsBrand)):null,
    days:appr.length?avg(appr.map(v=>v.days)):null,
    ader:sent.length?avg(sent.map(v=>last(v).ader)):null,
    checks:vids.reduce((a,v)=>a+v.versions.length,0),
    caught:vids.reduce((a,v)=>a+v.versions.slice(0,-1).reduce((b,x)=>b+x.findings.length+(x.minor||0),0),0),
    queue:vids.filter(v=>v.status==='enviado').length,
    adjust:vids.filter(v=>v.status==='ajuste').length, byCrit};
}

function pearson(xs,ys){const mx=avg(xs),my=avg(ys);let a=0,b=0,c=0;xs.forEach((x,i)=>{a+=(x-mx)*(ys[i]-my);b+=(x-mx)**2;c+=(ys[i]-my)**2});return b&&c?a/Math.sqrt(b*c):0}

function ring(v,color,size=84,label='',stroke=9){
  const r=(size-stroke)/2, c=2*Math.PI*r, off=c*(1-clamp(v,0,100)/100);
  return `<div class="ring" style="width:${size}px;height:${size}px" role="img" aria-label="${esc(label)}: ${v} de 100"><svg width="${size}" height="${size}" aria-hidden="true"><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--fill)" stroke-width="${stroke}"/><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${color}" stroke-width="${stroke}" stroke-linecap="round" stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}"/></svg><div class="rv"><div><b style="font-size:${Math.round(size*.3)}px">${v}</b>${label&&size>=70?`<small>${esc(label)}</small>`:''}</div></div></div>`;
}
const aderColor=(v,min)=>v>=min?'var(--green-fill)':v>=60?'var(--orange-fill)':'var(--red-fill)';

function scatter(rows){
  const W=560,H=280,P={l:46,r:16,t:14,b:42}, ymax=Math.max(...rows.map(r=>r.vendas))*1.12||1;
  const X=v=>P.l+(v-30)/70*(W-P.l-P.r), Y=v=>H-P.b-v/ymax*(H-P.t-P.b);
  const k=Math.min(5,Math.floor(rows.length/2)), realTop=new Set(rows.slice().sort((a,b)=>b.vendas-a.vendas).slice(0,k)), ourTop=new Set(rows.slice().sort((a,b)=>b.perf-a.perf).slice(0,k));
  const ty=[0,.25,.5,.75,1].map(f=>Math.round(ymax/1.12*f));
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Nota de performance da IA contra vendas reais">
    ${ty.map(t=>`<line class="grid" x1="${P.l}" x2="${W-P.r}" y1="${Y(t)}" y2="${Y(t)}"/><text class="axis" x="${P.l-8}" y="${Y(t)+4}" text-anchor="end">${t}</text>`).join('')}
    ${[30,50,70,90].map(t=>`<text class="axis" x="${X(t)}" y="${H-P.b+18}" text-anchor="middle">${t}</text>`).join('')}
    <text class="axis" x="${(W+P.l)/2}" y="${H-4}" text-anchor="middle">Nota de performance dada pela IA, sem ver o resultado</text>
    <text class="axis" x="12" y="${H/2}" text-anchor="middle" transform="rotate(-90 12 ${H/2})">Vendas reais</text>
    ${rows.map(r=>`<circle class="pt ${realTop.has(r)?'top':''} ${ourTop.has(r)?'ours':''}" cx="${X(r.perf)}" cy="${Y(r.vendas)}" r="${ourTop.has(r)?8:6}"><title>${esc(r.creator)}: nota ${r.perf}, ${r.vendas} vendas</title></circle>`).join('')}
  </svg>`;
}

function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function trackProgress(){

  if(r.startsWith('b/results')&&!S.progress.resultsViewed){S.progress.resultsViewed=true;save()}

function render(){
  trackProgress();
  const keep=$('#cscroll'), prevTop=keep?keep.scrollTop:0, sameRoute=UI.lastRoute===S.route;

function critRows(list,scope,id,withElim){
  const tot=list.reduce((a,c)=>a+Number(c.weight||0),0)||1;
  return list.map((c,i)=>`<div class="crit"><div><b>${esc(c.label)}</b>${c.custom?' <span class="chip">criado por você</span>':''}<div class="xs muted">${Math.round(Number(c.weight||0)/tot*100)}% da nota</div></div>
    <div class="small muted">${(c.checks||[]).slice(0,3).map(esc).join('<br>')||'—'}</div>
    <div class="w"><input type="range" min="0" max="40" step="5" value="${c.weight}" data-field="w" data-scope="${scope}" data-id="${id}" data-i="${i}" aria-label="Peso de ${esc(c.label)}"><output>${c.weight}</output></div>
    <div class="el">${withElim?`<label class="switch"><input type="checkbox" ${c.elim?'checked':''} data-field="elim" data-scope="${scope}" data-id="${id}" data-i="${i}" aria-label="${esc(c.label)} bloqueia o envio se falhar"><span></span></label><span>${c.elim?'Bloqueia':'Não'}</span>${c.custom?`<button class="iconbtn" style="width:30px;height:30px" data-act="rmCrit" data-scope="${scope}" data-id="${id}" data-i="${i}" aria-label="Remover critério ${esc(c.label)}">${ic('x','sm')}</button>`:''}`:`<span class="xs faint">Não bloqueia</span>`}</div></div>`).join('');
}
function listCard(b,key,title,cls,icon,hint){
  return `<section class="card"><div class="row between"><h3 class="row" style="gap:8px">${ic(icon)}${title}</h3>${hint?`<span class="xs muted">${hint}</span>`:''}</div>
    <div class="items">${b[key].map((x,i)=>`<span class="item ${cls}">${ic(icon)}${esc(x)}<button data-act="rmItem" data-list="${key}" data-i="${i}" aria-label="Remover: ${esc(x)}">${ic('x','sm')}</button></span>`).join('')||'<span class="small muted">Nada cadastrado ainda.</span>'}</div>
    <div class="row"><label class="sr" for="add-${key}">Adicionar em ${title}</label><input class="inp" id="add-${key}" style="flex:1;min-width:180px" placeholder="Adicionar…" data-enter="addItem" data-list="${key}"><button class="btn sm" data-act="addItem" data-list="${key}">${ic('plus','sm')}Adicionar</button></div></section>`;
}

      <label class="field"><span>Público</span><input class="inp" value="${esc(b.publico)}" data-field="bf" data-key="publico"></label>

    <div class="grid2">${listCard(b,'podeFalar','Pode e deve falar','yes','check')}${listCard(b,'naoPode','Não pode falar','no','xoct','vira eliminatório')}${listCard(b,'visual','Regras visuais','vis','eye','a IA olha as cenas')}${listCard(b,'obrigatorios','Itens obrigatórios','req','flag')}</div>
    <p class="xs muted row" style="gap:6px">${ic('checkc','sm')}As alterações são salvas automaticamente.</p>`;

  if(tab==='criterios'){
    const loading=UI.genLoading===b.id;
    body=`${why('A IA usa estes critérios para dar a nota. Peso maior significa mais importância. Um critério eliminatório bloqueia o envio se falhar, mesmo com a nota geral alta.')}
    ${b.guideDirty?`<div class="tip" style="border-left-color:var(--orange-fill)">${ic('warn')}<div><b>O guia mudou</b><span class="small">Atualize os critérios para a IA considerar as mudanças.</span></div><button class="btn sm primary" data-act="genCrit" data-id="${b.id}">Atualizar</button></div>`:''}
    <section class="card"><div class="row between"><h3 class="row" style="gap:6px">${ic('shield')}Aderência à marca ${infoBtn('aderencia')}</h3><button class="btn sm tinted" data-act="genCrit" data-id="${b.id}" ${loading?'disabled':''}>${loading?'Gerando…':`${ic('wand','sm')}Gerar de novo a partir do guia`}</button></div>
      <div class="crit-h"><span>Critério</span><span>O que a IA verifica</span><span>Peso</span><span>Eliminatório ${infoBtn('eliminatorio')}</span></div>${critRows(b.criteria,'brand',b.id,true)}
      <div class="row"><label class="sr" for="newCrit">Novo critério</label><input class="inp" id="newCrit" style="flex:1;min-width:220px" placeholder="Novo critério, ex.: Mostrar o produto sendo usado" data-enter="addCrit" data-scope="brand" data-id="${b.id}"><button class="btn sm" data-act="addCrit" data-scope="brand" data-id="${b.id}">${ic('plus','sm')}Adicionar critério</button></div></section>
    <section class="card"><h3 class="row" style="gap:6px">${ic('bolt')}Potencial de performance ${infoBtn('performance')}</h3><p class="small muted">Padrão da agência para todas as marcas. Orienta o creator e não bloqueia o envio.</p>${critRows(S.perf,'perf','',false)}</section>
    <section class="card"><h3 class="row" style="gap:6px">Nota mínima para enviar ${infoBtn('minima')}</h3><div class="row" style="max-width:520px"><input type="range" min="50" max="95" step="5" value="${b.minScore}" data-field="minScore" data-scope="brand" data-id="${b.id}" aria-label="Nota mínima" style="flex:1"><output class="num" style="font-weight:700;font-size:1.4rem;width:44px">${b.minScore}</output></div>

}

/* ---------- Resultados ---------- */
function vBResults(tab){
  const T=(k,l)=>`<button role="tab" aria-selected="${tab===k}" class="${tab===k?'on':''}" data-act="nav" data-to="b/results/${k}">${l}</button>`;
  const opts=allCampOptions(); let body='';
  if(tab==='antes'){
    UI.cmpA=UI.cmpA||opts[0].id; UI.cmpB=UI.cmpB||(opts.find(o=>o.id==='c1')||opts[1]).id;
    const A=campStats(UI.cmpA),B=campStats(UI.cmpB);
    const line=(l,a,b,fmt,better)=>{const d=(a==null||b==null)?null:b-a;const cls=d==null||Math.abs(d)<1e-9||!better?'':((better==='up'?d>0:d<0)?'up':'dn');return `<tr><td>${l}</td><td class="num">${a==null?'—':fmt(a)}</td><td class="num">${b==null?'—':fmt(b)}</td><td class="d ${cls}">${d==null?'—':Math.abs(d)<1e-9?'Igual':(cls==='up'?'Melhor · ':cls==='dn'?'Pior · ':'')+(d>0?'+':'−')+fmt(Math.abs(d))}</td></tr>`};
    body=`${why('Compare uma campanha feita antes da plataforma com uma feita com ela. Suba campanhas antigas na aba "Enviar campanha anterior".')}
    <div class="grid2"><label class="field"><span>Campanha A</span><select class="inp" data-field="cmpA">${opts.map(o=>`<option value="${o.id}" ${o.id===UI.cmpA?'selected':''}>${esc(o.label)}</option>`).join('')}</select></label><label class="field"><span>Campanha B</span><select class="inp" data-field="cmpB">${opts.map(o=>`<option value="${o.id}" ${o.id===UI.cmpB?'selected':''}>${esc(o.label)}</option>`).join('')}</select></label></div>
    <div class="tw"><table><thead><tr><th>Métrica</th><th>A</th><th>B</th><th>Diferença (B − A)</th></tr></thead><tbody>
      ${line('Vídeos',A.n,B.n,x=>Math.round(x),null)}${line('Aprovados de primeira',A.first,B.first,pct,'up')}${line('Rodadas quando devolvido',A.rounds,B.rounds,x=>dec(x),'down')}${line('Tempo até aprovar (dias)',A.days,B.days,x=>dec(x),'down')}${line('Nota média de aderência',A.ader,B.ader,x=>Math.round(x),'up')}${line('Nota média de performance',A.perf,B.perf,x=>Math.round(x),'up')}${line('CTR médio',A.ctr,B.ctr,x=>dec(x,2)+'%','up')}${line('Vendas totais',A.vendas,B.vendas,x=>Math.round(x).toLocaleString('pt-BR'),'up')}
    </tbody></table></div>
    <p class="small muted">Vendas e CTR aparecem depois de importar os resultados dos anúncios na página da campanha.</p>`;
  }
  if(tab==='nota'){
    const bt=opts.filter(o=>campStats(o.id).hasRes); UI.bt=bt.find(o=>o.id===UI.bt)?UI.bt:(bt[0]&&bt[0].id);
    if(!UI.bt) body=empty('chart','Sem dados de vendas ainda','Envie uma campanha anterior com resultados, ou importe os resultados dos anúncios de uma campanha.',`<button class="btn tinted" data-act="nav" data-to="b/results/enviar">Enviar campanha anterior</button>`);
    else{const Tt=campStats(UI.bt),rows=Tt.rows.filter(r=>r.vendas!=null),k=Math.min(5,Math.floor(rows.length/2));
      const realTop=rows.slice().sort((a,b)=>b.vendas-a.vendas).slice(0,k),ourTop=rows.slice().sort((a,b)=>b.perf-a.perf).slice(0,k),hit=ourTop.filter(r=>realTop.includes(r)).length,r=pearson(rows.map(x=>x.perf),rows.map(x=>x.vendas)),saved=(rows.length-k)*300;
      body=`${why('Teste retroativo: a IA dá nota a vídeos já publicados sem ver o resultado, e comparamos com as vendas reais. Se acertar, a marca testa em anúncio só os melhores.')}
      <label class="field" style="max-width:480px"><span>Campanha</span><select class="inp" data-field="bt">${bt.map(o=>`<option value="${o.id}" ${o.id===UI.bt?'selected':''}>${esc(o.label)}</option>`).join('')}</select></label>
      <div class="grid2"><section class="card chart" aria-label="Gráfico">${scatter(rows)}<div class="row small" style="gap:16px"><span class="row" style="gap:6px"><svg width="12" height="12" aria-hidden="true"><circle cx="6" cy="6" r="5" fill="var(--accent)"/></svg>${k} que mais venderam</span><span class="row" style="gap:6px"><svg width="14" height="14" aria-hidden="true"><circle cx="7" cy="7" r="5" fill="none" stroke="var(--green-fill)" stroke-width="2.5"/></svg>${k} com maior nota da IA</span></div></section>
        <div class="stack"><div class="grid2" style="grid-template-columns:1fr 1fr"><div class="kpi"><div class="top"><span>Acertos no top ${k}</span></div><div class="v">${hit} de ${k}</div><div class="cmp">Os que mais venderam estavam entre as maiores notas</div></div><div class="kpi"><div class="top"><span>Correlação</span></div><div class="v">${dec(r,2)}</div><div class="cmp">Entre a nota e as vendas (1 = perfeita)</div></div></div>
        <div class="card tint"><p>Testando em anúncio só os ${k} vídeos com maior nota, a marca gastaria cerca de <b>${brl(saved)}</b> a menos (a R$ 300 por vídeo) e ${hit===k?'encontraria todos':`encontraria ${hit} dos ${k}`} que mais venderam.</p></div>
        <p class="xs muted">Dados simulados. Na validação, este teste roda com vídeos e resultados reais de uma marca parceira.</p></div></div>`}
  }
  if(tab==='enviar'){
    const up=UI.upl;
    body=`${why('Suba uma campanha já feita: os vídeos e a planilha de resultados dos anúncios. A IA dá nota a cada vídeo sem ver o resultado, para você comparar.')}
    <section class="card" style="max-width:640px"><label class="field"><span>Nome da campanha</span><input class="inp" id="upName" value="Dia dos Pais (antes da plataforma)"></label>
      <label class="field"><span>Marca</span><select class="inp" id="upBrand">${S.brands.map(b=>`<option value="${b.id}">${esc(b.name)}</option>`).join('')}</select></label>
      <label class="field"><span>Quantidade de vídeos</span><input class="inp" id="upN" type="number" min="6" max="20" value="12"></label>
      <div class="drop">${ic('upload')}<b>12 vídeos + resultados.csv</b><span class="xs muted">Arquivos de exemplo desta demonstração</span></div>
      ${up?`<div class="stack" style="gap:6px"><span class="small">Analisando os vídeos… ${up.p}%</span><div class="progress" role="progressbar" aria-valuenow="${up.p}" aria-valuemin="0" aria-valuemax="100"><i style="width:${up.p}%"></i></div></div>`:`<button class="btn primary" style="align-self:flex-start" data-act="uploadPast">${ic('upload','sm')}Enviar e analisar</button>`}</section>`;
  }
  return `<div class="ptitle"><div><h1>Resultados</h1><p>O ganho medido com os dados da própria marca, e o teste de que a nota acerta o que vende.</p></div></div>
    <div class="seg" role="tablist" aria-label="Seções de resultados">${T('antes','Antes e depois')}${T('nota','A nota acerta o que vende?')}${T('enviar','Enviar campanha anterior')}</div>${body}`;
}

const UI={tour:null,sheet:null,toast:null,undo:null,chk:{},wizard:null,wizErr:null,apprTab:'fila',apprCamp:'all',cmpA:null,cmpB:null,bt:null,loginRole:'b',authMode:'entrar',loginErr:null,onbStep:0,genLoading:null,importing:null,upl:null,adjType:'',adjText:'',sheetErr:null,lastRoute:null,scrollTo:null};

const snap=()=>{UI.undo=JSON.stringify(S)};
function critListFor(scope,id){if(scope==='brand')return brand(id).criteria;if(scope==='perf')return S.perf;if(scope==='wizard')return UI.wizard.criteria;if(scope==='wperf')return UI.wizard.perf;return []}
function propagateBrand(b){S.campaigns.filter(c=>c.brandId===b.id).forEach(c=>{const extra=c.criteria.filter(x=>x.id==='camp_msg'||x.id==='camp_cta');c.criteria=genCriteria(b,c.criteria.filter(x=>x.id!=='camp_msg'&&x.id!=='camp_cta')).concat(extra)})}
function closeSheet(){UI.sheet=null;UI.sheetErr=null;renderSheet()}
function finishLogin(role){
  S.role=role; UI.loginErr=null;
  if(UI.tour&&UI.tour.i===1) UI.tour.i=2;
  if(!S.onb[role]){UI.onbStep=0;go('onb/'+role)} else go(role==='b'?'b/home':'c/home');
}
function tourGo(i){
  const s=TOUR[i]; UI.tour={i};
  if(s.login){UI.loginRole=s.login;UI.authMode='entrar';go('login');return}
  if(s.role){S.role=s.role;S.onb[s.role]=true}
  if(s.route==='b/new') newWizard();
  if(s.route.startsWith('c/check/')){const id=s.route.split('/')[2],v=myVideo(id);if(!v||v.status==='checando')delete UI.chk[id]}
  go(s.route);
}

const A={
  toTop:()=>window.scrollTo({top:0,behavior:'smooth'}),
  scrollTo:e=>{const el=document.getElementById(e.dataset.id);if(el)el.scrollIntoView({behavior:'smooth',block:'start'})},
  toSite:()=>go('site'),
  toLogin:e=>{UI.authMode=e.dataset.mode||'entrar';UI.loginErr=null;go('login')},
  startDemo:()=>{UI.tour={i:1};UI.loginRole='b';UI.authMode='entrar';go('login')},
  demoAs:e=>{UI.loginRole=e.dataset.role;UI.authMode='entrar';go('login')},
  loginRole:e=>{UI.loginRole=e.dataset.role;render()},
  authMode:e=>{UI.authMode=e.dataset.mode;UI.loginErr=null;render()},
  forgot:()=>toast('Na demonstração não é preciso senha: a conta já está preenchida.'),
  onbStep:e=>{UI.onbStep=clamp((UI.onbStep||0)+Number(e.dataset.d),0,2);render()},
  onbDone:e=>{const r=e.dataset.role;S.onb[r]=true;UI.onbStep=0;go(r==='b'?'b/home':'c/home')},
  replayOnb:e=>{const r=e.dataset.role||S.role||'b';S.role=r;UI.onbStep=0;closeSheet();go('onb/'+r)},
  nav:e=>{if(e.dataset.tab)UI.apprTab=e.dataset.tab;go(e.dataset.to)},
  switchRole:()=>{if(S.role==='b'){S.role='c';S.onb.c=true;go('c/home')}else{S.role='b';S.onb.b=true;go('b/approvals')}},
  logout:()=>{S.role=null;closeSheet();go('site');toast('Você saiu da conta.')},
  tourOpen:()=>{closeSheet();UI.tour={i:0};renderTour()},
  tourClose:()=>{UI.tour=null;renderTour()},
  tourStep:e=>{const i=clamp(UI.tour.i+Number(e.dataset.d),0,TOUR.length-1);tourGo(i)},
  tourGo:e=>tourGo(Number(e.dataset.i)),
  sheet:e=>{UI.sheet={type:e.dataset.type,id:e.dataset.id,k:e.dataset.k,q:e.dataset.q};UI.sheetErr=null;if(e.dataset.type==='adjust'){UI.adjType='';UI.adjText=''}renderSheet()},
  closeSheet:()=>closeSheet(),
  closeSheetBg:(e,ev)=>{if(ev.target===e)closeSheet()},
  dismissTip:e=>{S.tips[e.dataset.k]=true;save();render()},
  askReset:()=>{UI.sheet={type:'reset'};renderSheet()},
  doReset:()=>{try{localStorage.removeItem(KEY)}catch(e){}S=seed();Object.assign(UI,{tour:null,sheet:null,chk:{},wizard:null,undo:null,cmpA:null,cmpB:null,bt:null});go('site');toast('Demonstração recomeçada com os dados de exemplo.')},
  undo:()=>{if(!UI.undo)return;S=JSON.parse(UI.undo);UI.undo=null;save();closeSheet();render();toast('Ação desfeita.')},
  /* aprovações */
  apprTab:e=>{UI.apprTab=e.dataset.tab;render()},
  approve:e=>{const v=S.videos.find(x=>x.id===e.dataset.id),c=camp(v.campaignId);snap();v.status='aprovado';v.days=+(0.8+v.roundsBrand*1.4+Math.random()*.8).toFixed(1);S.progress.approvedOne=true;
    feed(`Vídeo de ${cr(v.creatorId).name} aprovado em ${c.name}. Pagamento de ${brl(c.pagamento)} liberado.`);save();closeSheet();render();toast(`Aprovado. Pagamento liberado para ${cr(v.creatorId).name.split(' ')[0]}.`,{act:'undo',label:'Desfazer'})},
  batchDo:()=>{const f=UI.apprCamp||'all',vs=S.videos.filter(v=>v.status==='enviado'&&last(v).ader>=85&&(f==='all'||v.campaignId===f));snap();vs.forEach(v=>{v.status='aprovado';v.days=+(0.8+v.roundsBrand*1.4+Math.random()*.6).toFixed(1)});S.progress.approvedOne=true;
    feed(`${vs.length} vídeos aprovados em lote.`);save();closeSheet();render();toast(`${vs.length} ${vs.length===1?'vídeo aprovado':'vídeos aprovados'}. Pagamentos liberados.`,{act:'undo',label:'Desfazer'})},
  adjType:e=>{const t=$('#adjText');if(t)UI.adjText=t.value;UI.adjType=e.dataset.t;renderSheet()},
  sendAdjust:e=>{const v=S.videos.find(x=>x.id===e.dataset.id),c=camp(v.campaignId),b=brand(c.brandId),txt=($('#adjText').value||'').trim(),type=UI.adjType;
    if(!txt){UI.adjText='';UI.sheetErr='Escreva o que precisa mudar. O creator vai ler esse comentário.';renderSheet();return}
    snap();v.status='ajuste';v.roundsBrand++;v.note=txt;
    if(type){b[type].push(txt);b.criteria=genCriteria(b,b.criteria);propagateBrand(b);feed(`Nova regra no guia de ${b.name}: "${txt}".`)}
    feed(`A marca pediu ajuste a ${cr(v.creatorId).name}.`);save();closeSheet();render();toast(type?'Ajuste pedido e regra adicionada ao guia.':`Ajuste pedido a ${cr(v.creatorId).name.split(' ')[0]}.`,{act:'undo',label:'Desfazer'})},
  boost:e=>{const v=S.videos.find(x=>x.id===e.dataset.id);v.boosted=true;feed(`Vídeo de ${cr(v.creatorId).name} enviado para anúncio (simulado).`);save();render();toast('Vídeo enviado para anúncio (simulado).')},
  importResults:e=>{const c=camp(e.dataset.id),vs=S.videos.filter(v=>v.campaignId===c.id&&SENT.includes(v.status)),r=rng(c.id.length*97+vs.length),res={};
    vs.forEach(v=>{const perf=last(v).perf,ctr=+(clamp(.45+perf/100*1.9+(r()-.5)*.55,.2,4)).toFixed(2),views=Math.round(20000+r()*25000);res[v.id]={views,ctr,vendas:Math.round(views*ctr/100*(.04+perf/100*.04+(r()-.5)*.02))}});
    S.results[c.id]=res;feed(`Resultados dos anúncios importados para ${c.name}.`);save();render();toast('Resultados importados.',{act:'goResults',label:'Ver'})},
  goResults:()=>{UI.toast=null;renderToast();go('b/results/nota')},
  /* campanhas */
  newCampaign:()=>{newWizard();go('b/new')},
  wzPrev:()=>{UI.wizErr=null;UI.wizard.step--;render()},
  wzGo:e=>{UI.wizErr=null;UI.wizard.step=Number(e.dataset.i);render()},
  wzNext:()=>{const w=UI.wizard;UI.wizErr=null;
    if(w.step===1&&!w.name.trim()){UI.wizErr='Dê um nome para a campanha. Ele aparece no convite do creator.';render();return}
    if(w.step===2&&!w.mensagem.trim()){UI.wizErr='Preencha a mensagem principal, ou use "Importar briefing". Ela vira um critério da nota.';render();return}
    if(w.step===4&&!w.creators.length){UI.wizErr='Convide pelo menos um creator.';render();return}
    w.step++;render();window.scrollTo(0,0)},
  fillBrief:()=>{const w=UI.wizard,b=brand(w.brandId);Object.assign(w,b.id==='nuvem'?{objetivo:'Vendas com cupom',mensagem:'Tricô feito à mão para o dia a dia',cta:'Compre pelo link da bio',cupom:'NUVEM15',formato:'Reels',duracao:'30 a 60 s',prazo:'30/10',pagamento:500,ganchos:'"Quanto tempo leva para tricotar um suéter?"'}
    :{objetivo:'Vendas com cupom',mensagem:'Energia sem cafeína para treinar de manhã',cta:'Use o cupom no link da bio',cupom:'VITTA15',formato:'Reels e TikTok',duracao:'60 a 90 s',prazo:'30/10',pagamento:700,ganchos:'"Treino às 6h sem café. Te mostro."'});if(!w.name)w.name='Treino de manhã';UI.wizErr=null;render();toast('Briefing lido. Confira os campos preenchidos.')},
  wzPublish:()=>{const w=UI.wizard;wzEnsureCrit();const id='c'+Date.now(),invites={};w.creators.forEach(c=>invites[c]='convidado');
    S.campaigns.push({id,brandId:w.brandId,name:w.name||'Nova campanha',objetivo:w.objetivo,mensagem:w.mensagem,cta:w.cta,cupom:w.cupom||'—',formato:w.formato,duracao:w.duracao,prazo:w.prazo||'—',pagamento:Number(w.pagamento)||0,ganchos:w.ganchos,minScore:w.minScore,criteria:w.criteria,perf:w.perf,invites,created:'hoje'});
    S.progress.createdCampaign=true;feed(`Campanha ${w.name} publicada. ${w.creators.length} creators convidados.`);UI.wizard=null;go('b/campaign/'+id);toast(`Campanha publicada. ${w.creators.length} ${w.creators.length===1?'convite enviado':'convites enviados'}.`)},
  /* guias */
  rmItem:e=>{const b=brand(S.route.split('/')[2]),removed=b[e.dataset.list][+e.dataset.i];snap();b[e.dataset.list].splice(+e.dataset.i,1);b.guideDirty=true;save();render();toast(`Removido: ${removed}`,{act:'undo',label:'Desfazer'})},
  addItem:e=>{const b=brand(S.route.split('/')[2]),inp=$('#add-'+e.dataset.list),val=inp&&inp.value.trim();if(!val){if(inp)inp.focus();return}b[e.dataset.list].push(val);b.guideDirty=true;save();render();const n=$('#add-'+e.dataset.list);if(n)n.focus()},
  importGuide:e=>{const b=brand(e.dataset.id);UI.importing={id:b.id,p:0};render();
    const tick=()=>{UI.importing.p=Math.min(100,UI.importing.p+17);if(UI.importing.p<100){render();setTimeout(tick,160);return}
      const key=/saúde|suplemento/i.test(b.seg)?'saude':/moda/i.test(b.seg)?'moda':'geral';if(!b.posicionamento){Object.assign(b,JSON.parse(JSON.stringify(GUIDE_TEMPLATES[key])));b.guideDirty=true}
      UI.importing=null;save();render();toast(`Guia lido: ${b.podeFalar.length+b.naoPode.length+b.visual.length+b.obrigatorios.length} regras encontradas.`)};setTimeout(tick,160)},
  genCrit:e=>{const b=brand(e.dataset.id);UI.genLoading=b.id;render();setTimeout(()=>{b.criteria=genCriteria(b,b.criteria);b.guideDirty=false;propagateBrand(b);UI.genLoading=null;save();render();toast('Critérios atualizados a partir do guia.')},800)},
  addCrit:e=>{const inp=$('#newCrit'),val=inp&&inp.value.trim();if(!val){if(inp)inp.focus();return}const scope=e.dataset.scope||'brand',id=e.dataset.id;critListFor(scope,id).push({id:'x'+Date.now(),label:val,weight:10,elim:false,custom:true,checks:[val]});if(scope==='brand')propagateBrand(brand(id));save();render();toast('Critério adicionado.')},
  rmCrit:e=>{snap();critListFor(e.dataset.scope,e.dataset.id).splice(+e.dataset.i,1);if(e.dataset.scope==='brand')propagateBrand(brand(e.dataset.id));save();render();toast('Critério removido.',{act:'undo',label:'Desfazer'})},
  createBrand:()=>{const name=($('#nbName').value||'').trim();if(!name){UI.sheetErr='Dê um nome para a marca.';renderSheet();return}
    const seg=$('#nbSeg').value,segL={saude:'Suplemento · saúde',moda:'Moda',geral:'Outro'}[seg],b={id:'b'+Date.now(),name,seg:segL,hue:Math.round(Math.random()*360),posicionamento:'',publico:'',tom:'',podeFalar:[],naoPode:[],visual:[],obrigatorios:[],minScore:75,guideDirty:false};
    b.criteria=genCriteria(b);S.brands.push(b);closeSheet();feed(`Marca ${name} adicionada.`);go('b/brand/'+b.id+'/guia');toast('Marca criada. Agora importe ou preencha o guia.')},
  uploadPast:()=>{const name=($('#upName').value||'').trim()||'Campanha anterior',bid=$('#upBrand').value,n=clamp(parseInt($('#upN').value)||12,6,20);UI.upl={p:0};render();
    const tick=()=>{UI.upl.p=Math.min(100,UI.upl.p+12);if(UI.upl.p<100){render();setTimeout(tick,170);return}
      const id='p'+Date.now();S.past.push({id,name,brandId:bid,when:'enviada hoje',before:true,videos:genPastVideos(n,(Date.now()%1000)+3,true)});UI.upl=null;UI.cmpA=id;UI.bt=id;feed(`Campanha "${name}" enviada com ${n} vídeos e resultados.`);save();go('b/results/nota');toast(`${n} vídeos analisados.`)};setTimeout(tick,170)},
  /* creator */
  accept:e=>{const c=camp(e.dataset.id);c.invites[S.me]='aceito';feed(`${cr(S.me).name} aceitou o convite de ${c.name}.`);save();render();toast('Convite aceito. Leia o cartão antes de gravar.')},
  decline:()=>{go('c/home');toast('Tudo bem. O convite fica guardado para depois.')},
  pickFile:e=>{const id=e.dataset.id,st=chkState(id),v=myVideo(id);st.file=`meu_video_v${v?v.versions.length+1:1}.mp4`;render()},
  chkQ:e=>{chkState(e.dataset.id).q=e.dataset.q;UI.demoOpen=true;render()},
  runCheck:e=>{const id=e.dataset.id,st=chkState(id);if(!st.file){const v=myVideo(id);st.file=`meu_video_v${v?v.versions.length+1:1}.mp4`}st.stage='analyzing';st.p=0;render();
    const tick=()=>{if(!UI.chk[id]||UI.chk[id].stage!=='analyzing')return;st.p=Math.min(100,st.p+9+Math.round(Math.random()*8));if(st.p<100){render();setTimeout(tick,220);return}
      const c=camp(id),b=brand(c.brandId);let v=myVideo(id);if(!v){v={id:'v'+Date.now(),campaignId:id,creatorId:S.me,status:'checando',roundsBrand:0,days:null,note:'',boosted:false,versions:[]};S.videos.push(v)}
      if(v.status!=='ajuste')v.status='checando';
      v.versions.push({n:v.versions.length+1,at:nowLabel(),file:st.file,...analyze(c,b,st.q,Date.now()%100000)});st.stage='result';st.file=null;UI.demoOpen=false;save();render();$('#cscroll')&&($('#cscroll').scrollTop=0)};setTimeout(tick,220)},
  newVersion:e=>{const id=e.dataset.id;UI.chk[id]={stage:'upload',file:null,q:'bom',p:0};go('c/check/'+id)},
  send:e=>{const id=e.dataset.id,c=camp(id),v=myVideo(id),x=last(v);v.status='enviado';feed(`${cr(S.me).name} enviou o vídeo de ${c.name} (aderência ${x.ader}, performance ${x.perf}) depois de ${v.versions.length} checagens.`);chkState(id).stage='sent';save();render();toast(`Enviado para ${brand(c.brandId).name}.`)},
};

/* ---------- eventos ---------- */
document.addEventListener('click',ev=>{const e=ev.target.closest('[data-act]');if(!e||e.disabled)return;const f=A[e.dataset.act];if(!f)return;if(e.dataset.act!=='closeSheetBg')ev.preventDefault();f(e,ev)});
document.addEventListener('submit',ev=>{const f=ev.target;if(!f.dataset||!f.dataset.form)return;ev.preventDefault();
  const email=($('#f-email').value||'').trim(),pass=$('#f-pass').value||'';
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){UI.loginErr='Digite um e-mail válido, como nome@empresa.com.';render();return}
  if(!pass){UI.loginErr='Digite a senha.';render();return}
  finishLogin(UI.loginRole||'b')});
document.addEventListener('keydown',ev=>{
  if(ev.key==='Escape'){if(UI.sheet){closeSheet();return}if(UI.tour){UI.tour=null;renderTour();return}}
  const e=ev.target;if(ev.key==='Enter'&&e.dataset&&e.dataset.enter){ev.preventDefault();const f=A[e.dataset.enter];if(f)f(e,ev)}});
document.addEventListener('input',ev=>{const e=ev.target,f=e.dataset&&e.dataset.field;
  if(e.id==='adjText'){UI.adjText=e.value;return}
  if((f==='w'||f==='minScore')&&e.nextElementSibling&&e.nextElementSibling.tagName==='OUTPUT') e.nextElementSibling.textContent=e.value;});
document.addEventListener('change',ev=>{const e=ev.target,f=e.dataset&&e.dataset.field;if(!f)return;
  if(f==='apprCamp')UI.apprCamp=e.value;
  else if(f==='cmpA')UI.cmpA=e.value;else if(f==='cmpB')UI.cmpB=e.value;else if(f==='bt')UI.bt=e.value;
  else if(f==='notif'){toast(e.checked?'Avisos ligados.':'Avisos desligados.');return}
  else if(f==='bf'){const b=brand(S.route.split('/')[2]);b[e.dataset.key]=e.value;b.guideDirty=true}
  else if(f==='w'){const l=critListFor(e.dataset.scope,e.dataset.id);l[+e.dataset.i].weight=clamp(parseInt(e.value)||0,0,40);if(e.dataset.scope==='brand')propagateBrand(brand(e.dataset.id));if(e.dataset.scope==='perf')S.campaigns.forEach(c=>{c.perf=JSON.parse(JSON.stringify(S.perf))})}
  else if(f==='elim'){const l=critListFor(e.dataset.scope,e.dataset.id);l[+e.dataset.i].elim=e.checked;if(e.dataset.scope==='brand')propagateBrand(brand(e.dataset.id));toast(e.checked?'Agora este critério bloqueia o envio se falhar.':'Este critério não bloqueia mais o envio.')}
  else if(f==='minScore'){if(e.dataset.scope==='brand')brand(e.dataset.id).minScore=+e.value;else UI.wizard.minScore=+e.value}
  else if(f==='wz'){UI.wizard[e.dataset.key]=e.value;if(e.dataset.key==='brandId'){UI.wizard.critFor=null;UI.wizard.minScore=brand(e.value).minScore}}
  else if(f==='wzCreator'){const w=UI.wizard;if(e.checked){if(!w.creators.includes(e.dataset.id))w.creators.push(e.dataset.id)}else w.creators=w.creators.filter(x=>x!==e.dataset.id)}
  save();render()});

/* ---------- início ---------- */
if(S.route!=='site'&&S.route!=='login'&&!S.role) S.route='site';
render();


</script>
</body>
